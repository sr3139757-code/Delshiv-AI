<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>Delshiv Quick Command</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #e5f2ff;
      overflow: hidden;
      user-select: none;
    }
    .shell {
      margin: 8px;
      border-radius: 16px;
      background: rgba(11, 16, 28, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.42);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.65), 0 0 24px rgba(56, 189, 248, 0.16);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      -webkit-app-region: drag;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }
    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 15px;
      -webkit-app-region: no-drag;
    }
    input::placeholder { color: #7c8da6; }
    .hint {
      font-size: 11px;
      color: #7c8da6;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .out {
      display: none;
      max-height: 280px;
      overflow-y: auto;
      padding: 12px 16px 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-app-region: no-drag;
    }
    .out.show { display: block; }
    .out.err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <div class="bar">
      <span class="badge">DELSHIV</span>
      <input id="q" type="text" placeholder="Ask anything or run a command (e.g. 'organize downloads', 'open notepad')..." autofocus />
      <span class="hint">Enter ↵ · Esc</span>
    </div>
    <div id="out" class="out"></div>
  </div>
  <script>
    const input = document.getElementById("q");
    const out = document.getElementById("out");
    const shell = document.getElementById("shell");
    const host = window.delshivHost;
    let reqSeq = 0;

    function resizeToContent() {
      const h = Math.min(440, Math.max(82, (shell?.offsetHeight || 66) + 18));
      host?.quickbarResize?.(h);
    }

    function showOutput(text, isErr = false) {
      out.textContent = String(text || "");
      out.className = isErr ? "out show err" : "out show";
      requestAnimationFrame(resizeToContent);
    }

    function resetBar() {
      reqSeq++;
      input.value = "";
      out.className = "out";
      out.textContent = "";
      host?.quickbarResize?.(82);
    }

    window.addEventListener("focus", () => { input.focus(); input.select(); });
    window.addEventListener("blur", () => { resetBar(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        resetBar();
        host?.quickbarHide?.();
      }
    });

    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const text = input.value.trim();
      if (!text) return;
      const mySeq = ++reqSeq;
      showOutput("Thinking...");
      try {
        if (!host?.quickbarRun) {
          showOutput("QuickBar host bridge unavailable.", true);
          return;
        }
        const res = await host.quickbarRun(text);
        if (mySeq !== reqSeq) return;
        if (!res || !res.ok) showOutput(res?.error || "Failed to execute.", true);
        else showOutput(res.reply || res.message || "Done.");
      } catch (err) {
        if (mySeq !== reqSeq) return;
        showOutput(err?.message || String(err), true);
      }
    });
  </script>
</body>
</html>
